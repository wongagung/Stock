name: Build macOS Apple Silicon (M1)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-macos-m1:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri macOS M1 (.app standalone)
        run: npx tauri build --target aarch64-apple-darwin --bundles app

      - name: Zip .app bundle
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r "Stock-Material-Dashboard-macOS-M1.zip" "Stock Material Dashboard.app"

      - name: Upload macOS M1 .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Material-Dashboard-macOS-M1
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Stock-Material-Dashboard-macOS-M1.zip

