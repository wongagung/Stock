[package]
name = "stock-material-dashboard"
version = "1.0.0"
description = "Hardened Rust & Tauri Inventory Dashboard for Fiber Optic Stock Material"
authors = ["Stock Material Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stock_material_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
csv = "1.3"
url = "2.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

